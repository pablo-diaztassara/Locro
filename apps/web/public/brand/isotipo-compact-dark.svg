<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Isotipo compacto { locro. }">
  <!--
    { locro. } — Isotipo Compacto (para header y escalas entre 28px y 64px)
  -->
  <title>Isotipo compacto { locro. }</title>

  <!-- Vapor binario simplificado (#FF5A00) -->
  <g stroke="#FF5A00" stroke-width="2.8" stroke-linecap="round">
    <line x1="23" y1="15" x2="23" y2="20" />
    <line x1="23" y1="24.5" x2="23" y2="25" />
    <line x1="31.5" y1="8" x2="31.5" y2="15" />
    <line x1="31.5" y1="19.5" x2="31.5" y2="24.5" />
    <line x1="40" y1="17" x2="40" y2="23" />
  </g>

  <!-- Chispas IA (#EBA83A y #FF5A00) -->
  <path d="M 48 8 Q 49 13 54 14 Q 49 15 48 20 Q 47 15 42 14 Q 47 13 48 8 Z" fill="#EBA83A" />
  <circle cx="53.5" cy="22" r="2.2" fill="#FF5A00" />

  <!-- 3 Rombos de maíz / datos (#EBA83A) -->
  <g fill="#EBA83A">
    <polygon points="21,29.5 24.5,33 21,36.5 17.5,33" />
    <polygon points="32,30.5 36,34.5 32,38.5 28,34.5" />
    <polygon points="43,29.5 46.5,33 43,36.5 39.5,33" />
  </g>

  <!-- Cazuela minimalista de circuito (#F9F4EB) -->
  <g fill="none" stroke="#F9F4EB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Borde superior abierto al centro -->
    <path d="M 19.5 29 C 11 30 7 33 7 36.5 C 7 41.5 18 44.5 32 44.5 C 46 44.5 57 41.5 57 36.5 C 57 33.5 53 30.5 45 29" />

    <!-- Cuerpo izquierdo + circuito -->
    <path d="M 9 40 C 12 52 20 58 30.5 58 L 30.5 50.5" />
    <path d="M 16 44.5 L 22 49.5 L 22 53" stroke-width="2.6" />

    <!-- Cuerpo derecho + circuito -->
    <path d="M 55 40 C 52 52 44 58 34 58 L 34 52.5 L 40 48.5 L 46.5 48.5" />
  </g>

  <!-- Nodos de circuito -->
  <circle cx="19.5" cy="29" r="2.4" fill="#F9F4EB" stroke="#F9F4EB" stroke-width="2" />
  <circle cx="45" cy="29" r="2.4" fill="#F9F4EB" />
  <circle cx="7" cy="36.5" r="2.6" fill="#F9F4EB" />
  <circle cx="57" cy="36.5" r="2.6" fill="#F9F4EB" />
  <circle cx="30.5" cy="49" r="2.3" fill="#F9F4EB" stroke="#F9F4EB" stroke-width="2" />
  <circle cx="22" cy="53.5" r="2.3" fill="#F9F4EB" />
  <circle cx="47" cy="48.5" r="2.3" fill="#F9F4EB" />
</svg>
